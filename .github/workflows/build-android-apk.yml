name: Build MOM Recorder APK

on:
  push:
    branches: [ "claude/call-transcript-mom-app-aymd9n", "main" ]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Grant execute permission to gradlew
        working-directory: android-app
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Verify APK exists
        working-directory: android-app
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$APK"
          echo "APK_PATH=$GITHUB_WORKSPACE/android-app/$APK" >> $GITHUB_ENV

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MOMRecorder-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

  build-release:
    name: Build Release APK (unsigned)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Build Release APK
        working-directory: android-app
        run: gradle assembleRelease --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MOMRecorder-release-unsigned-apk
          path: android-app/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 90
