name: Build MOM Recorder APK

on:
  push:
    branches: [ "claude/call-transcript-mom-app-aymd9n", "main" ]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true

      - name: Install Gradle 8.5
        run: |
          # Check if gradle is already available
          if gradle --version 2>/dev/null | grep -q "8\\."; then
            echo "Gradle 8.x already available: $(gradle --version | head -1)"
          else
            echo "Installing Gradle 8.5..."
            wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /opt/gradle-dist
            sudo ln -sf /opt/gradle-dist/gradle-8.5/bin/gradle /usr/local/bin/gradle
            gradle --version
          fi
          gradle --version

      - name: Grant execute permission to gradlew
        working-directory: android-app
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android-app/**/*.gradle.kts', 'android-app/**/*.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        working-directory: android-app
        run: |
          # Try system gradle first, fall back to ./gradlew
          if command -v gradle &>/dev/null; then
            echo "Using system gradle: $(gradle --version | head -1)"
            gradle assembleDebug --no-daemon --stacktrace
          else
            echo "Using gradlew wrapper"
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Verify APK exists
        working-directory: android-app
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$APK"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MOMRecorder-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
